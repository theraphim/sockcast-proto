[package]
name = "sockcast-proto"
version = "0.1.0"
edition = "2021"
build = false
description = "Shared Protobuf definitions, Ed25519 NodeGrant cryptography, RFC 4252 SSH payload parser, and enrollment bundle codec for Sockcast"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theraphim/sockcast-proto"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
prost = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tonic = "0.12"
